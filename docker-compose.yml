services:
  webreview:
    build: .
    image: auto-review-web
    ports:
      # ホスト側ポートは REVIEW_PORT で変更可 (既定 8080)。
      - "${REVIEW_PORT:-8080}:8080"
    environment:
      # 認証 (ホストの認証ディレクトリは共有しない)
      GH_TOKEN: ${GH_TOKEN:?GH_TOKEN を .env に設定してください}
      CODEX_API_KEY: ${CODEX_API_KEY:?CODEX_API_KEY を .env に設定してください}
      # レビュー設定
      REVIEW_ORG: ${REVIEW_ORG:-your-org}
      REVIEW_MODEL: ${REVIEW_MODEL:-gpt-5.6-terra}
    volumes:
      # git リポジトリとログファイルは volume で永続化する。
      - review_repos:/data/work
      - review_logs:/data/review_logs
    security_opt:
      # bubblewrap を使うため、AppArmor を無効化する。seccomp は無効化せず、pivot_root を使うための seccomp プロファイルを指定する。
      - apparmor:unconfined
      #- seccomp:unconfined
      - seccomp=./seccomp-bwrap.json
    cap_add:
      # bubblewrap を使うため、SYS_ADMIN 権限を付与する。
      - SYS_ADMIN
    restart: unless-stopped

volumes:
  review_repos:
  review_logs:
