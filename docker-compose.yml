name: auto-review-web

services:
  webreview:
    build: .
    image: auto-review-web
    # tini を PID 1 にして、シグナルの転送と子プロセス (codex など) の回収を任せる。
    init: true
    ports:
      # ホスト側の待ち受けアドレスとポートは REVIEW_HOST / REVIEW_PORT で変更可
      # (既定 127.0.0.1:8080)。LAN 内のほかの PC から使うなら REVIEW_HOST=0.0.0.0。
      - "${REVIEW_HOST:-127.0.0.1}:${REVIEW_PORT:-8080}:8080"
    environment:
      # 認証 (ホストの認証ディレクトリは共有しない)
      # GITHUB_AUTH_MODE=pat なら GH_TOKEN、app なら GITHUB_APP_* を使う。
      GITHUB_AUTH_MODE: ${GITHUB_AUTH_MODE:-pat}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      # PR をホストするサービス (github.com なら空のままで既定値が使われる)
      REVIEW_FORGE: ${REVIEW_FORGE:-}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_CLONE_URL: ${GITHUB_CLONE_URL:-}
      GITHUB_GIT_USERNAME: ${GITHUB_GIT_USERNAME:-}
      GITHUB_POST_MODE: ${GITHUB_POST_MODE:-}
      # Codex は CODEX_API_KEY か CODEX_ACCESS_TOKEN のどちらか一方。両方空なら起動時に警告する。
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      # レビュー設定
      REVIEW_OWNER: ${REVIEW_OWNER:?REVIEW_OWNER を .env に設定してください}
      REVIEW_MODEL: ${REVIEW_MODEL:-gpt-6.1-sol}
      REVIEW_REASONING_EFFORT: ${REVIEW_REASONING_EFFORT:-medium}
      REVIEW_DESCRIPTION: ${REVIEW_DESCRIPTION:-}
      REVIEW_TIMEOUT: ${REVIEW_TIMEOUT:-3600}
      REVIEW_STDERR_RETENTION_DAYS: ${REVIEW_STDERR_RETENTION_DAYS:-30}
      REVIEW_JOB_RETENTION_DAYS: ${REVIEW_JOB_RETENTION_DAYS:-30}
      # コンテナ内では ports の転送先で待ち受ける。.env の REVIEW_HOST / REVIEW_PORT は
      # ホスト側の設定なので、ここで固定値に上書きする。
      REVIEW_HOST: 0.0.0.0
      REVIEW_PORT: 8080
    volumes:
      # git リポジトリと、DB + codex の生ログを volume で永続化する。
      - review_repos:/data/work
      - review_logs:/data/review_logs
      # GitHub App の秘密鍵 (GITHUB_AUTH_MODE=app のときのみ使う)。
      # ホスト側に鍵が無い場合もマウントできるよう、ディレクトリごと read-only で渡す。
      - ./secrets:/run/secrets:ro
    security_opt:
      # bubblewrap を使うため、AppArmor を無効化する。seccomp は無効化せず、pivot_root を使うための seccomp プロファイルを指定する。
      - apparmor:unconfined
      #- seccomp:unconfined
      - seccomp=./seccomp-bwrap.json
    cap_add:
      # bubblewrap を使うため、SYS_ADMIN 権限を付与する。
      - SYS_ADMIN
    restart: unless-stopped

volumes:
  review_repos:
  review_logs:
