<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex レビュー</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Codex レビュー</h1>
    <p class="meta" id="config-meta"></p>
    <!-- REVIEW_DESCRIPTION の内容を app.js が描画する (未設定なら非表示) -->
    <div class="description hidden" id="description"></div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="run">レビュー実行</button>
    <button class="tab-btn" data-tab="summary">集計</button>
  </nav>

  <!-- ===== レビュー実行タブ ===== -->
  <section id="tab-run" class="tab-panel active">
    <form id="review-form">
      <label for="pr-url">PR の URL</label>
      <div class="form-row">
        <input type="text" id="pr-url" name="url"
               placeholder="https://github.com/&lt;owner&gt;/&lt;repo&gt;/pull/&lt;番号&gt;"
               autocomplete="off">
        <button type="submit" id="submit-btn">レビュー実行</button>
      </div>
      <label class="checkbox">
        <input type="checkbox" id="include-quality" checked>
        バグだけでなく、書き方・品質の改善も指摘する
      </label>
      <label class="checkbox">
        <input type="checkbox" id="auto-post" checked>
        レビュー完了後、自動的に PR に投稿する
      </label>
      <p id="form-message" class="form-message"></p>
    </form>

    <div id="busy-banner" class="banner hidden"></div>

    <h2>レビュー一覧</h2>
    <div id="job-list" class="job-list"></div>
    <p id="job-empty" class="empty hidden">まだレビューはありません。</p>
  </section>

  <!-- ===== 集計タブ ===== -->
  <!-- 一覧はメタデータのみを取得し、レビュー本文は開かれた行だけ個別に読み込む -->
  <section id="tab-summary" class="tab-panel">
    <div class="form-row">
      <select id="summary-repo" aria-label="リポジトリで絞り込む">
        <option value="">すべてのリポジトリ</option>
      </select>
      <input type="search" id="summary-q" placeholder="レビュー本文を検索"
             autocomplete="off">
      <button id="reload-summary">更新</button>
    </div>
    <p id="summary-status" class="meta"></p>
    <div id="summary-list" class="summary-list"></div>
    <div class="form-row pager hidden" id="summary-pager">
      <button id="summary-prev" type="button">← 前</button>
      <span id="summary-range" class="meta"></span>
      <button id="summary-next" type="button">次 →</button>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
